<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/logo.png">
<title>VulnScope | Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  body { background: #050a12; color: #e2e8f0; }
  .card {
    background: #0d1520;
    border: 1px solid #1a2332;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .logo-anim {
    object-fit: contain;
    display: block;
    margin-left: auto;
    margin-right: auto;
  }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 2.75rem; }
  .password-toggle {
    position: absolute; right: 0; top: 0; height: 100%;
    display: flex; align-items: center; padding: 0 0.9rem;
    cursor: pointer; color: #9ca3af; background: transparent; border: none;
  }
  .password-toggle:hover { color: #00f0ff; }
  #bg-slideshow {
    transition: background-image 1s ease-in-out;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div id="bg-slideshow" class="fixed inset-0 w-full h-full -z-10"></div>
  <div class="fixed inset-0 bg-black/60 z-0"></div>

  <div class="card w-full max-w-md p-8 relative z-10">
    <div class="text-center mb-8">
      <video src="/static/vulnscope-logo-transparent.webm" autoplay loop muted playsinline class="w-24 h-24 md:w-32 md:h-32 mx-auto object-contain mb-4"></video>
      <h1 class="text-2xl font-bold">Welcome back</h1>
      <p class="text-gray-400 text-sm mt-2">Sign in to VulnScope</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-medium">Email</label>
        <input type="email" id="email" required class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="you@example.com">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-medium">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" required class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••">
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)" aria-label="Show password">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-green-500 to-cyan-500 text-black font-semibold py-3 rounded-lg hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed">
        Sign In
      </button>
      <p id="errorMsg" class="text-xs text-red-400 text-center hidden"></p>
    </form>

    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-gray-700"></div>
      <span class="text-xs text-gray-500">or</span>
      <div class="flex-1 h-px bg-gray-700"></div>
    </div>

    <a href="/auth/google" class="w-full bg-white text-gray-800 font-semibold py-3 rounded-lg flex items-center justify-center gap-3 hover:opacity-90 transition">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.56 2.95-2.23 5.45-4.78 7.13l7.36 5.71C43.92 37.83 46.98 31.8 46.98 24.55z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.36-5.71c-2.04 1.37-4.65 2.2-7.54 2.2-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <p class="text-center text-xs text-gray-500 mt-6">
      Don't have an account?
      <a href="/auth/register" class="text-cyan-400 hover:underline">Register</a>
    </p>
  </div>

<script>
function togglePassword(inputId, btn) {
  const input = document.getElementById(inputId);
  const icon = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.remove('fa-eye');
    icon.classList.add('fa-eye-slash');
    btn.setAttribute('aria-label', 'Hide password');
  } else {
    input.type = 'password';
    icon.classList.remove('fa-eye-slash');
    icon.classList.add('fa-eye');
    btn.setAttribute('aria-label', 'Show password');
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const error = document.getElementById('errorMsg');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
  error.classList.add('hidden');

  try {
    const formData = new FormData();
    formData.append('username', email);
    formData.append('password', password);

    const res = await fetch('/auth/login', {
      method: 'POST',
      body: formData,
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Login failed' }));
      error.textContent = err.detail || 'Login failed';
      error.classList.remove('hidden');
      return;
    }

    const data = await res.json();
    const token = data.access_token;

    // Set cookie and redirect
    document.cookie = `access_token=${token}; path=/; max-age=2592000; SameSite=Lax`;
    window.location.href = '/dashboard';
  } catch (err) {
    error.textContent = 'Network error. Please try again.';
    error.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
});

// --- Background slideshow ---
const LAND = ['/static/bg-land-1.jpg', '/static/bg-land-2.jpg', '/static/bg-land-3.jpg', '/static/bg-land-4.jpg', '/static/bg-land-5.jpg', '/static/bg-land-6.jpg', '/static/bg-land-7.jpg'];
const PORT = ['/static/bg-port-1.jpg', '/static/bg-port-2.jpg', '/static/bg-port-3.jpg', '/static/bg-port-4.jpg', '/static/bg-port-5.jpg', '/static/bg-port-6.jpg', '/static/bg-port-7.jpg'];
let bgIdx = 0;
let bgTimer = null;

function currentSet() {
  return window.innerWidth > window.innerHeight ? LAND : PORT;
}

function showBg() {
  const set = currentSet();
  const el = document.getElementById('bg-slideshow');
  if (el) el.style.backgroundImage = `url('${set[bgIdx % set.length]}')`;
}

function startBg() {
  if (bgTimer) clearInterval(bgTimer);
  bgIdx = 0;
  showBg();
  bgTimer = setInterval(() => { bgIdx++; showBg(); }, 8000);
}

window.addEventListener('resize', () => { bgIdx = 0; showBg(); });
startBg();
</script>
</body>
</html>
