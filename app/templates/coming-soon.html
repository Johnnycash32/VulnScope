<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/static/logo.png">
<title>{{ title }} | VulnScope</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  body { background: #050a12; color: #e2e8f0; }
  .card { background: #0d1520; border: 1px solid #1a2332; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="card w-full max-w-md p-8 text-center">
    <img src="/static/logo.png" class="w-20 h-20 mx-auto object-contain mb-4" alt="VulnScope">
    <h1 class="text-2xl font-bold mb-2">{{ title }}</h1>
    <p class="text-gray-400 text-sm mb-6">This section is coming soon. We're building something powerful here.</p>
    <a href="/dashboard" class="inline-flex items-center gap-2 bg-gradient-to-r from-green-500 to-cyan-500 text-black font-semibold px-5 py-2.5 rounded-lg hover:opacity-90 transition">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>
  </div>
</body>
</html>
