<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050a12' rx='6'/%3E%3Cpath d='M8 8 l8 0 l0 8 l-8 0 z' fill='%2300f0ff'/%3E%3Cpath d='M12 12 l4 0 l0 4 l-4 0 z' fill='%2300ff88'/%3E%3C/svg%3E">
<title>VulnScope | Create Account</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; }
  body { background: #050a12; color: #e2e8f0; }
  .card {
    background: linear-gradient(145deg, #0f1724, #0a1018);
    border: 1px solid #1a2332;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
</style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <div class="card w-full max-w-md p-8">
    <div class="text-center mb-8">
      <video class="logo-anim mx-auto mb-4" autoplay loop muted playsinline>
        <source src="{{ url_for('static', filename='vulnscope-logo-anim.mp4') }}" type="video/mp4">
      </video>
      <h1 class="text-2xl font-bold">Create Account</h1>
      <p class="text-gray-400 text-sm mt-2">Join VulnScope</p>
    </div>

    <form id="registerForm" class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-medium">Full Name</label>
        <input type="text" id="full_name" required class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="Jane Doe">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-medium">Email</label>
        <input type="email" id="email" required class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="you@example.com">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1 font-medium">Password</label>
        <input type="password" id="password" required class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="••••••••" minlength="8">
        <p class="text-[10px] text-gray-500 mt-1">Minimum 8 characters</p>
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-green-500 to-cyan-500 text-black font-semibold py-3 rounded-lg hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed">
        Create Account
      </button>
      <p id="errorMsg" class="text-xs text-red-400 text-center hidden"></p>
    </form>

    <p class="text-center text-xs text-gray-500 mt-6">
      Already have an account?
      <a href="/auth/login" class="text-cyan-400 hover:underline">Sign in</a>
    </p>
  </div>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const error = document.getElementById('errorMsg');
  const full_name = document.getElementById('full_name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
  error.classList.add('hidden');

  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ full_name, email, password }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: 'Registration failed' }));
      error.textContent = err.detail || 'Registration failed';
      error.classList.remove('hidden');
      return;
    }

    const data = await res.json();
    const token = data.access_token;

    document.cookie = `access_token=${token}; path=/; max-age=2592000; SameSite=Lax`;
    window.location.href = '/dashboard';
  } catch (err) {
    error.textContent = 'Network error. Please try again.';
    error.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Create Account';
  }
});
</script>
</body>
</html>
