[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnscope"
version = "0.1.0"
description = "VulnScope - web-based vulnerability assessment platform (backend foundation)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VulnScope Team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "email-validator>=2.0",
    "psycopg2-binary>=2.9",
    "celery>=5.4",
    "packaging>=23.0",
    "redis>=5.0",
    "requests>=2.31",
    "weasyprint>=6.1",
    "jinja2>=3.1",
    "dnspython>=2.4",
    "apscheduler>=3.10",
    "croniter>=2.4",
    "authlib>=1.3",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"